services:
  cartenz-smartgov-backup-gateway:
    image: adityabintang/smartgov-backup-gateway:v1.0
    build: .
    container_name: cartenz-smartgov-backup-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDR:-127.0.0.1}:25100:25100"
    volumes:
      - ./gateway_data:/app/data
